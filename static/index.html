<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise AI Incident Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void: #0A0D12;
    --bg-panel: rgba(16, 20, 28, 0.85);
    --bg-panel-solid: #10141C;
    --bg-raised: rgba(22, 27, 37, 0.9);
    --border: rgba(35, 42, 56, 0.8);
    --text-primary: #E8EBF2;
    --text-muted: #7A8399;
    --accent-signal: #FFB020;
    --accent-cyan: #3FD6C4;
    --accent-danger: #F0546B;
    --accent-success: #4ADE80;
    --glass-blur: 12px;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(63,214,196,0.1), transparent 40%),
      radial-gradient(circle at 100% 0%, rgba(255,176,32,0.08), transparent 35%),
      var(--bg-void);
    color:var(--text-primary);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    backdrop-filter: blur(0px);
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* Status ticker with glassmorphism */
  .ticker{
    display:flex;
    align-items:center;
    gap:22px;
    padding:12px 22px;
    background: var(--bg-panel);
    border-bottom:1px solid var(--border);
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    flex-shrink:0;
    flex-wrap:wrap;
    row-gap:6px;
    backdrop-filter: blur(var(--glass-blur));
  }
  .ticker .brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:var(--sans);
    font-weight:700;
    font-size:14px;
    color:var(--text-primary);
    letter-spacing:0.2px;
    margin-right:6px;
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent-signal);
    box-shadow:0 0 0 0 rgba(255,176,32,0.6);
    animation:pulse 2s infinite;
    flex-shrink:0;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,176,32,0.55);}
    70%{box-shadow:0 0 0 7px rgba(255,176,32,0);}
    100%{box-shadow:0 0 0 0 rgba(255,176,32,0);}
  }
  .ticker .sep{color:var(--border);}
  .ticker .stat b{color:var(--text-primary); font-weight:600;}
  .ticker .stat.cyan b{color:var(--accent-cyan);}

  /* Transcript area */
  .transcript{
    flex:1;
    overflow-y:auto;
    padding:28px 0 12px;
  }
  .transcript-inner{
    max-width:900px;
    margin:0 auto;
    padding:0 22px;
  }

  .empty-state{
    max-width:640px;
    margin:8vh auto 0;
    text-align:center;
    padding:0 20px;
  }
  .empty-state h1{
    font-size:28px;
    margin:0 0 10px;
    font-weight:700;
    background: linear-gradient(90deg, var(--accent-cyan), var(--accent-signal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .empty-state p{
    color:var(--text-muted);
    font-size:14.5px;
    line-height:1.6;
    margin:0 0 26px;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .chip{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text-primary);
    background:var(--bg-panel);
    border:1px solid var(--border);
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s, box-shadow .15s;
    backdrop-filter: blur(var(--glass-blur));
  }
  .chip:hover{border-color:var(--accent-cyan); background:var(--bg-raised); box-shadow: 0 4px 12px rgba(63,214,196,0.15);}
  .chip:active{transform:scale(0.97);}

  .msg{
    display:flex;
    margin-bottom:26px;
    animation:rise .25s ease;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg.user{justify-content:flex-end;}
  .msg-bubble{
    max-width:100%;
  }
  .msg.user .msg-bubble{
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:12px 12px 2px 12px;
    padding:12px 16px;
    font-size:14.5px;
    line-height:1.55;
    backdrop-filter: blur(var(--glass-blur));
  }
  .msg.assistant .msg-bubble{width:100%;}
  .msg-meta{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-muted);
    margin-bottom:8px;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .msg.user .msg-meta{justify-content:flex-end;}
  .role-tag{
    font-weight:600;
    letter-spacing:0.4px;
  }
  .role-tag.assistant{color:var(--accent-cyan);}
  .role-tag.user{color:var(--text-muted);}

  /* Severity badge */
  .severity-badge{
    font-family: var(--mono);
    font-size: 10px;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
    letter-spacing:0.3px;
  }
  .severity-P1{background: rgba(240,84,107,0.2); color: var(--accent-danger); border:1px solid rgba(240,84,107,0.5);}
  .severity-P2{background: rgba(255,176,32,0.2); color: var(--accent-signal); border:1px solid rgba(255,176,32,0.5);}
  .severity-P3{background: rgba(63,214,196,0.2); color: var(--accent-cyan); border:1px solid rgba(63,214,196,0.5);}
  .severity-P4{background: rgba(122,131,153,0.2); color: var(--text-muted); border:1px solid rgba(122,131,153,0.5);}

  /* Confidence visualization */
  .confidence-container{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0;
    flex-wrap:wrap;
  }
  .confidence-bar{
    flex:1;
    min-width:150px;
    height:8px;
    background:var(--bg-panel-solid);
    border-radius:4px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .confidence-fill{
    height:100%;
    border-radius:4px;
    transition: width 0.5s ease;
  }
  .confidence-fill.High{background: linear-gradient(90deg, var(--accent-success), var(--accent-cyan));}
  .confidence-fill.Medium{background: linear-gradient(90deg, var(--accent-signal), #FACC15);}
  .confidence-fill.Low{background: linear-gradient(90deg, var(--accent-danger), #FB7185);}
  .confidence-text{
    font-family:var(--mono);
    font-size:11px;
  }
  .confidence-label{
    font-weight:700;
    font-size:11px;
  }
  .confidence-label.High{color:var(--accent-success);}
  .confidence-label.Medium{color:var(--accent-signal);}
  .confidence-label.Low{color:var(--accent-danger);}

  /* Tag badges */
  .tags-container{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:10px 0;
  }
  .tag-badge{
    font-family:var(--mono);
    font-size:10px;
    padding:3px 8px;
    border-radius:6px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    color:var(--text-muted);
  }

  /* Assistant text */
  .assistant-text{
    font-size:14.5px;
    line-height:1.68;
    padding:4px 0 8px;
  }
  .assistant-text b{color:var(--text-primary);}
  .assistant-text code{
    font-family:var(--mono);
    background:var(--bg-panel);
    border:1px solid var(--border);
    padding:1px 5px;
    border-radius:4px;
    font-size:13px;
  }
  .assistant-text h3, .assistant-text h4, .assistant-text h5, .assistant-text h6 {
    font-family:var(--sans);
    color:var(--text-primary);
    font-weight:700;
    line-height:1.35;
    margin:16px 0 8px;
  }
  .assistant-text h4 { color: var(--accent-cyan); font-size: 16px; }
  .assistant-text h5 { 
    font-size: 13px; 
    text-transform: uppercase; 
    letter-spacing: 0.4px; 
    color: var(--text-muted); 
  }
  .assistant-text ul, .assistant-text ol {
    margin:0 0 12px;
    padding-left:22px;
  }
  .assistant-text li {
    margin-bottom:6px;
    line-height:1.6;
  }
  .assistant-text pre {
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    margin:0 0 12px;
    overflow-x:auto;
  }
  .assistant-text pre code {
    background:none;
    border:none;
    padding:0;
    font-size:12.5px;
    line-height:1.55;
    color:var(--text-primary);
    white-space:pre;
  }

  .incident-resolution-panel {
    background: rgba(22, 27, 37, 0.4);
    border: 1px solid rgba(35, 42, 56, 0.8);
    border-radius: 10px;
    padding: 16px;
    backdrop-filter: blur(8px);
  }

  .incident-panel-divider {
    height: 2px;
    background: linear-gradient(90deg, rgba(63,214,196,0.4), rgba(255,176,32,0.4), rgba(63,214,196,0.4));
    margin: 8px 0 16px;
  }

  .cursor{
    display:inline-block;
    width:7px; height:15px;
    background:var(--accent-cyan);
    margin-left:2px;
    vertical-align:text-bottom;
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .src-chip{
    font-family:var(--mono);
    font-size:11px;
    color:var(--accent-cyan);
    background:rgba(63,214,196,0.1);
    border:1px solid rgba(63,214,196,0.35);
    padding:0px 6px;
    border-radius:5px;
    cursor:pointer;
    white-space:nowrap;
    text-decoration:none;
  }
  .src-chip:hover{background:rgba(63,214,196,0.2);}

  /* Citation cards with ranking */
  .citations{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .citation-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-left:3px solid var(--accent-cyan);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    transition:background .15s, box-shadow .15s;
    backdrop-filter: blur(var(--glass-blur));
  }
  .citation-card.primary{border-left-color: var(--accent-signal);}
  .citation-card.supporting{border-left-color: var(--accent-cyan);}
  .citation-card.additional{border-left-color: var(--text-muted);}
  .citation-card.flash{box-shadow:0 0 0 2px rgba(63,214,196,0.4);}
  .citation-card:hover{background:var(--bg-raised);}
  .citation-card.sparse-only{border-left-color:var(--accent-signal);}
  .cite-head{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:var(--mono);
    font-size:11.5px;
    flex-wrap:wrap;
  }
  .cite-rank{
    font-weight:700;
    padding:2px 8px;
    border-radius:6px;
    font-size:10px;
  }
  .cite-rank.primary{background: rgba(255,176,32,0.2); color: var(--accent-signal);}
  .cite-rank.supporting{background: rgba(63,214,196,0.2); color: var(--accent-cyan);}
  .cite-rank.additional{background: rgba(122,131,153,0.2); color: var(--text-muted);}
  .cite-id{
    color:var(--bg-void);
    background:var(--accent-cyan);
    font-weight:700;
    padding:2px 8px;
    border-radius:6px;
    flex-shrink:0;
  }
  .sparse-only .cite-id{background:var(--accent-signal);}
  .cite-path{color:var(--text-primary); font-weight:500;}
  .cite-lines{color:var(--text-muted); margin-left:auto;}
  .cite-badge{
    font-size:10px;
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:2px 8px;
    border-radius:6px;
  }
  .cite-snippet{
    font-size:12.5px;
    line-height:1.55;
    color:var(--text-muted);
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--border);
    display:none;
    white-space:pre-wrap;
  }
  .citation-card.open .cite-snippet{display:block;}

  /* No match improved */
  .no-match-card{
    background:rgba(240,84,107,0.08);
    border:1px solid rgba(240,84,107,0.35);
    border-left:3px solid var(--accent-danger);
    border-radius:10px;
    padding:16px;
    font-size:14px;
    line-height:1.6;
    color:var(--text-primary);
    backdrop-filter: blur(var(--glass-blur));
  }
  .no-match-card .tag{
    font-family:var(--mono);
    font-size:11px;
    font-weight:700;
    color:var(--accent-danger);
    letter-spacing:0.5px;
    display:block;
    margin-bottom:8px;
  }
  .no-match-section{
    margin-top:12px;
  }
  .no-match-section h5{
    font-size:12px;
    margin:0 0 6px;
    color:var(--text-muted);
    text-transform: uppercase;
    letter-spacing:0.3px;
  }
  .no-match-section ul{
    margin:0;
    padding-left:20px;
  }
  .no-match-section li{
    margin-bottom:4px;
  }

  .lat-footer{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-muted);
    margin-top:10px;
    opacity:0.8;
  }

  /* Next questions */
  .next-questions{
    margin-top:14px;
  }
  .next-questions h5{
    font-size:12px;
    margin:0 0 10px;
    color:var(--text-muted);
    text-transform: uppercase;
    letter-spacing:0.3px;
  }
  .next-questions-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .next-question-chip{
    background:var(--bg-panel);
    border:1px solid var(--border);
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    transition: all 0.15s;
    backdrop-filter: blur(var(--glass-blur));
  }
  .next-question-chip:hover{
    border-color:var(--accent-cyan);
    background:var(--bg-raised);
  }

  /* Interactive Checklist */
  .checklist{
    margin-top:14px;
  }
  .checklist h5{
    font-size:12px;
    margin:0 0 10px;
    color:var(--text-muted);
    text-transform: uppercase;
    letter-spacing:0.3px;
  }
  .checklist-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
    transition: all 0.15s;
    backdrop-filter: blur(var(--glass-blur));
  }
  .checklist-item:hover{background:var(--bg-raised);}
  .checklist-item.completed{
    opacity:0.7;
  }
  .checklist-item.completed .checklist-text{
    text-decoration: line-through;
  }
  .checklist-checkbox{
    width:20px;
    height:20px;
    border:2px solid var(--border);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .checklist-item.completed .checklist-checkbox{
    background:var(--accent-success);
    border-color:var(--accent-success);
  }
  .checklist-checkmark{
    color:var(--bg-void);
    font-size:14px;
    font-weight:700;
    display:none;
  }
  .checklist-item.completed .checklist-checkmark{
    display:block;
  }

  /* Incident Summary */
  .summary-section{
    margin-top:14px;
  }
  .summary-btn{
    background:linear-gradient(135deg, var(--accent-cyan), #0EA5E9);
    color:var(--bg-void);
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-family:var(--mono);
    font-weight:700;
    font-size:12px;
    cursor:pointer;
    transition: transform 0.1s, filter 0.15s;
  }
  .summary-btn:hover{filter:brightness(1.1);}
  .summary-btn:active{transform:scale(0.97);}
  .summary-content{
    margin-top:10px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
    font-size:13.5px;
    line-height:1.6;
    display:none;
  }
  .summary-content.visible{display:block;}
  .summary-actions{
    margin-top:10px;
    display:flex;
    gap:8px;
  }
  .download-btn{
    background:var(--bg-raised);
    color:var(--accent-cyan);
    border:1px solid var(--accent-cyan);
    padding:8px 14px;
    border-radius:6px;
    font-family:var(--mono);
    font-size:11px;
    cursor:pointer;
    transition: all 0.15s;
  }
  .download-btn:hover{background:rgba(63,214,196,0.1);}

  /* Retrieval Analytics */
  .analytics-toggle{
    margin-top:10px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:6px;
    font-family:var(--mono);
    font-size:11px;
    cursor:pointer;
    color:var(--text-muted);
    transition: all 0.15s;
  }
  .analytics-toggle:hover{color:var(--text-primary); border-color:var(--text-muted);}
  .analytics-panel{
    margin-top:10px;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    display:none;
    font-family:var(--mono);
    font-size:11px;
  }
  .analytics-panel.visible{display:block;}
  .analytics-row{
    display:flex;
    justify-content:space-between;
    padding:4px 0;
    border-bottom:1px dashed var(--border);
  }
  .analytics-row:last-child{border-bottom:none;}
  .analytics-label{color:var(--text-muted);}
  .analytics-value{color:var(--accent-cyan); font-weight:600;}

  /* Timeline */
  .timeline{
    margin-top:14px;
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .timeline-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-family:var(--mono);
  }
  .timeline-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--text-muted);
  }
  .timeline-dot.active{
    background:var(--accent-cyan);
    box-shadow:0 0 0 3px rgba(63,214,196,0.2);
  }
  .timeline-line{
    width:30px;
    height:2px;
    background:var(--border);
  }

  /* Input bar */
  .input-bar{
    flex-shrink:0;
    border-top:1px solid var(--border);
    background:var(--bg-panel);
    padding:14px 22px 18px;
    backdrop-filter: blur(var(--glass-blur));
  }
  .input-inner{
    max-width:900px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    font-family:var(--sans);
    font-size:14.5px;
    line-height:1.5;
    padding:12px 16px;
    border-radius:10px;
    outline:none;
    max-height:140px;
    transition:border-color .15s;
  }
  textarea:focus{border-color:var(--accent-cyan);}
  textarea::placeholder{color:var(--text-muted);}

  .send-btn{
    background: linear-gradient(135deg, var(--accent-signal), #F59E0B);
    color:#1A1200;
    border:none;
    font-family:var(--mono);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.3px;
    padding:13px 20px;
    border-radius:10px;
    cursor:pointer;
    transition:transform .1s, filter .15s;
    flex-shrink:0;
  }
  .send-btn:hover{filter:brightness(1.08);}
  .send-btn:active{transform:scale(0.97);}
  .send-btn:disabled{opacity:0.45; cursor:not-allowed;}

  .upload-btn{
    background:var(--bg-raised);
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:13px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .upload-btn:hover{
    color:var(--accent-cyan);
    border-color:var(--accent-cyan);
    background:rgba(63,214,196,0.05);
  }
  .upload-btn.loading{
    animation:pulse 1.5s infinite;
    cursor:wait;
    pointer-events:none;
    color:var(--accent-signal);
    border-color:var(--accent-signal);
  }

  .hint{
    max-width:900px;
    margin:8px auto 0;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-muted);
    padding:0 22px;
  }

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

  @media (max-width: 560px){
    .ticker{font-size:10.5px; gap:12px; padding:10px 14px;}
    .empty-state h1{font-size:22px;}
    .msg-bubble{max-width:92%;}
  }
</style>
</head>
<body>

  <div class="ticker" id="ticker">
    <div class="brand"><span class="live-dot"></span>ENTERPRISE AI INCIDENT COPILOT</div>
    <span id="stat-files" class="stat">-- files</span>
    <span class="sep">/</span>
    <span id="stat-chunks" class="stat">-- chunks</span>
    <span class="sep">/</span>
    <span id="stat-mode" class="stat cyan">--</span>
  </div>

  <div class="transcript" id="transcript">
    <div class="transcript-inner">
      <div class="empty-state" id="empty-state">
        <h1>What's the incident?</h1>
        <p>Ask in plain language. Answers are structured with severity, confidence, and citations.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="input-inner">
      <button class="upload-btn" id="upload-btn" title="Upload Runbook (.md, .pdf, .docx)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </button>
      <input type="file" id="file-input" accept=".md,.pdf,.docx" style="display: none;">
      <textarea id="input" rows="1" placeholder="e.g., database connection pool is exhausted"></textarea>
      <button class="send-btn" id="send-btn">SEND ⏎</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </div>

<script>
const SUGGESTIONS = [
  "database connection pool is exhausted",
  "disk space is critical on a prod node",
  "CPU utilization is pegged at 100%",
  "a kubernetes pod is stuck crash-looping",
  "how do I fail over an AWS RDS instance"
];

const transcript = document.getElementById('transcript');
const transcriptInner = transcript.querySelector('.transcript-inner');
const emptyState = document.getElementById('empty-state');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const chipsEl = document.getElementById('chips');
const uploadBtn = document.getElementById('upload-btn');
const fileInput = document.getElementById('file-input');
let conversationHistory = [];

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  
  uploadBtn.classList.add('loading');
  addUserMessage(`[System] Uploading runbook: ${file.name}...`);
  
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    const res = await fetch('/api/upload_runbook', {
      method: 'POST',
      body: formData
    });
    
    if(!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    
    const data = await res.json();
    addUserMessage(`[System] Successfully uploaded ${data.filename}. Index is updated and queryable!`);
    loadStats();
  } catch(err) {
    addUserMessage(`[System] Failed to upload ${file.name}: ${err.message}`);
  } finally {
    uploadBtn.classList.remove('loading');
    fileInput.value = '';
  }
});

function nowStamp(){
  const d = new Date();
  return d.toTimeString().slice(0,8);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatInline(s){
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+?)`/g, '<code>$1</code>');
  return s;
}

function formatText(raw){
  const blocks = [];
  let stripped = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const idx = blocks.length;
    blocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`);
    return `\u0000BLOCK${idx}\u0000`;
  });

  const rawLines = stripped.split('\n');
  const htmlParts = [];
  let listBuffer = [];
  let listType = null;
  let paraBuffer = [];

  function flushList(){
    if(listBuffer.length){
      const tag = listType === 'ol' ? 'ol' : 'ul';
      htmlParts.push(`<${tag}>${listBuffer.map(li => `<li>${li}</li>`).join('')}</${tag}>`);
      listBuffer = [];
      listType = null;
    }
  }
  function flushPara(){
    if(paraBuffer.length){
      htmlParts.push(`<p>${paraBuffer.join('<br>')}</p>`);
      paraBuffer = [];
    }
  }

  for(const line of rawLines){
    const trimmed = line.trim();

    if(trimmed === ''){
      flushList();
      flushPara();
      continue;
    }

    const blockMatch = trimmed.match(/^\u0000BLOCK(\d+)\u0000$/);
    if(blockMatch){
      flushList();
      flushPara();
      htmlParts.push(blocks[Number(blockMatch[1])]);
      continue;
    }

    const headingMatch = trimmed.match(/^(#{1,4})\s+(.*)$/);
    if(headingMatch){
      flushList();
      flushPara();
      const level = Math.min(headingMatch[1].length + 2, 6);
      htmlParts.push(`<h${level}>${formatInline(escapeHtml(headingMatch[2]))}</h${level}>`);
      continue;
    }

    const olMatch = trimmed.match(/^(\d+)[.)]\s+(.*)$/);
    if(olMatch){
      flushPara();
      if(listType && listType !== 'ol') flushList();
      listType = 'ol';
      listBuffer.push(formatInline(escapeHtml(olMatch[2])));
      continue;
    }

    const ulMatch = trimmed.match(/^[-*]\s+(.*)$/);
    if(ulMatch){
      flushPara();
      if(listType && listType !== 'ul') flushList();
      listType = 'ul';
      listBuffer.push(formatInline(escapeHtml(ulMatch[1])));
      continue;
    }

    flushList();
    paraBuffer.push(formatInline(escapeHtml(line)));
  }
  flushList();
  flushPara();

  return htmlParts.join('');
}

function linkifySources(html){
  return html.replace(/\[Source (\d+)\]/g, (m, n) =>
    `<a class="src-chip" data-src="${n}" onclick="jumpToSource(event,'${n}')">[Source ${n}]</a>`);
}

window.jumpToSource = function(e, n){
  e.preventDefault();
  const card = document.querySelector(`.citation-card[data-id="${n}"][data-active="1"]`);
  if(!card) return;
  card.scrollIntoView({behavior:'smooth', block:'center'});
  card.classList.add('flash');
  card.classList.add('open');
  setTimeout(()=>card.classList.remove('flash'), 900);
};

function toggleCitation(el){
  el.classList.toggle('open');
}

function loadStats(){
  fetch('/api/stats').then(r=>r.json()).then(d=>{
    document.getElementById('stat-files').innerHTML = `<b>${d.files_indexed}</b> runbooks`;
    document.getElementById('stat-chunks').innerHTML = `<b>${d.chunks_indexed}</b> chunks`;
    document.getElementById('stat-mode').textContent = d.retrieval_mode.toUpperCase();
  }).catch(()=>{
    document.getElementById('stat-mode').textContent = 'BACKEND OFFLINE';
  });
}

function renderChips(){
  chipsEl.innerHTML = '';
  SUGGESTIONS.forEach(q=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = q;
    c.onclick = () => { input.value = q; sendQuery(); };
    chipsEl.appendChild(c);
  });
}

function autoGrow(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
}
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendQuery();
  }
});
sendBtn.addEventListener('click', sendQuery);

function addUserMessage(text){
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `
    <div class="msg-bubble">
      <div class="msg-meta"><span>${nowStamp()}</span><span class="role-tag user">YOU</span></div>
      ${escapeHtml(text)}
    </div>`;
  transcriptInner.appendChild(div);
  scrollDown();
  conversationHistory.push({role:'user', content:text});
}

function scrollDown(){
  transcript.scrollTop = transcript.scrollHeight;
}

async function sendQuery(){
  const q = input.value.trim();
  if(!q) return;
  input.value = '';
  autoGrow();
  sendBtn.disabled = true;
  addUserMessage(q);

  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg assistant';
  transcriptInner.appendChild(msgDiv);
  
  let rawText = '';
  let sources = [];
  let retrievalMs = 0, generationMs = 0;
  let metadata = {};

  try{
    const res = await fetch('/api/query', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query:q})
    });
    if(!res.ok || !res.body) throw new Error('request failed');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for(const part of parts){
        const line = part.trim();
        if(!line.startsWith('data:')) continue;
        const payload = JSON.parse(line.slice(5).trim());

        if(payload.type === 'no_match'){
          retrievalMs = payload.retrieval_ms;
          metadata = payload;
          msgDiv.innerHTML = renderNoMatch(payload);
        } else if(payload.type === 'sources'){
          sources = payload.sources;
          retrievalMs = payload.retrieval_ms;
          metadata = payload;
        } else if(payload.type === 'token'){
          rawText += payload.text;
          msgDiv.innerHTML = renderAssistantMessage(rawText, true, metadata, sources);
          scrollDown();
        } else if(payload.type === 'done'){
          generationMs = payload.generation_ms;
        }
      }
    }

    if(sources.length || metadata.type !== 'no_match'){
      msgDiv.innerHTML = renderAssistantMessage(rawText, false, metadata, sources, retrievalMs, generationMs);
    }

  } catch(err){
    msgDiv.innerHTML = `
      <div class="msg-bubble">
        <div class="msg-meta"><span class="role-tag assistant">ASSISTANT</span><span>${nowStamp()}</span></div>
        <div class="no-match-card">
          <span class="tag">CONNECTION ERROR</span>
          Could not reach the backend. Is server.py running? (${escapeHtml(String(err))})
        </div>
      </div>`;
  } finally {
    sendBtn.disabled = false;
    scrollDown();
    conversationHistory.push({role:'assistant', content:rawText, metadata, sources});
  }
}

function renderNoMatch(payload){
  return `
    <div class="msg-bubble">
      <div class="msg-meta">
        <span class="role-tag assistant">ASSISTANT</span>
        <span>${nowStamp()}</span>
        <span class="severity-badge severity-${payload.severity}">${payload.severity}</span>
      </div>
      <div class="confidence-container">
        <div class="confidence-bar">
          <div class="confidence-fill ${payload.confidence_label}" style="width: ${payload.top1_cosine * 100}%"></div>
        </div>
        <span class="confidence-label ${payload.confidence_label}">${payload.confidence_label}</span>
        <span class="confidence-text">(${Math.round(payload.top1_cosine * 100)}%)</span>
      </div>
      <div class="tags-container">
        ${payload.tags.map(tag => `<span class="tag-badge">${tag}</span>`).join('')}
      </div>
      <div class="no-match-card">
        <span class="tag">NO CONFIDENT MATCH</span>
        ${escapeHtml(payload.message)}
        <div class="no-match-section">
          <h5>Possible Reasons</h5>
          <ul>
            ${payload.possible_reasons.map(r => `<li>${escapeHtml(r)}</li>`).join('')}
          </ul>
        </div>
        <div class="no-match-section">
          <h5>Recommended Actions</h5>
          <ul>
            ${payload.recommended_actions.map(a => `<li>${escapeHtml(a)}</li>`).join('')}
          </ul>
        </div>
      </div>
      <div class="lat-footer">retrieved in ${payload.retrieval_ms}ms</div>
    </div>`;
}

function renderAssistantMessage(text, isTyping, metadata, sources, retrievalMs, generationMs){
  let html = `
    <div class="msg-bubble">
      <div class="msg-meta">
        <span class="role-tag assistant">ASSISTANT</span>
        <span>${nowStamp()}</span>
        ${metadata.severity ? `<span class="severity-badge severity-${metadata.severity}">${metadata.severity}</span>` : ''}
      </div>`;

  if(metadata.top1_cosine){
    html += `
      <div class="confidence-container">
        <div class="confidence-bar">
          <div class="confidence-fill ${metadata.confidence_label}" style="width: ${metadata.top1_cosine * 100}%"></div>
        </div>
        <span class="confidence-label ${metadata.confidence_label}">${metadata.confidence_label}</span>
        <span class="confidence-text">(${Math.round(metadata.top1_cosine * 100)}%)</span>
      </div>`;
  }

  if(metadata.tags && metadata.tags.length){
    html += `
      <div class="tags-container">
        ${metadata.tags.map(tag => `<span class="tag-badge">${tag}</span>`).join('')}
      </div>`;
  }

  html += `
      <div class="timeline">
        <div class="timeline-item"><span class="timeline-dot active"></span>Alert</div>
        <div class="timeline-line"></div>
        <div class="timeline-item"><span class="timeline-dot active"></span>Diagnosis</div>
        <div class="timeline-line"></div>
        <div class="timeline-item"><span class="timeline-dot active"></span>Retrieval</div>
        <div class="timeline-line"></div>
        <div class="timeline-item"><span class="timeline-dot"></span>Recommendation</div>
        <div class="timeline-line"></div>
        <div class="timeline-item"><span class="timeline-dot"></span>Verification</div>
        <div class="timeline-line"></div>
        <div class="timeline-item"><span class="timeline-dot"></span>Resolved</div>
      </div>`;

  html += `<div class="incident-resolution-panel">
              <div class="incident-panel-divider"></div>
              <div class="assistant-text">${linkifySources(formatText(text))}${isTyping ? '<span class="cursor"></span>' : ''}</div>
            </div>`;

  if(!isTyping && sources && sources.length){
    html += `<div class="citations">`;
    sources.forEach((s, i) => {
      const n = i + 1;
      const sparseOnly = s.matched_sparse && !s.matched_dense;
      const badge = s.matched_dense && s.matched_sparse ? 'DENSE+BM25' : s.matched_dense ? 'DENSE' : 'BM25';
      const rank = i === 0 ? 'primary' : (i <= 2 ? 'supporting' : 'additional');
      const rankLabel = i === 0 ? 'Primary Source' : (i <= 2 ? 'Supporting Source' : 'Additional Reference');
      html += `
        <div class="citation-card ${rank} ${sparseOnly ? 'sparse-only' : ''}" data-id="${n}" data-active="1" onclick="toggleCitation(this)">
          <div class="cite-head">
            <span class="cite-rank ${rank}">${rankLabel}</span>
            <span class="cite-id">SRC ${String(n).padStart(2,'0')}</span>
            <span class="cite-path">${escapeHtml(s.file)} — ${escapeHtml(s.section)}</span>
            <span class="cite-badge">${badge}</span>
            <span class="cite-lines">L${s.start_line}-${s.end_line}</span>
          </div>
          <div class="cite-snippet">${escapeHtml(s.text)}</div>
        </div>`;
    });
    html += `</div>`;

    if(metadata.next_questions){
      html += `
        <div class="next-questions">
          <h5>Recommended Next Questions</h5>
          <div class="next-questions-list">
            ${metadata.next_questions.map(q => `
              <div class="next-question-chip" onclick="input.value='${escapeHtml(q)}'; sendQuery();">
                ${escapeHtml(q)}
              </div>
            `).join('')}
          </div>
        </div>`;
    }

    if(metadata.retrieval_analytics){
      html += `
        <button class="analytics-toggle" onclick="toggleAnalytics(this)">▼ Retrieval Analytics</button>
        <div class="analytics-panel">
          <div class="analytics-row"><span class="analytics-label">Chunks Retrieved</span><span class="analytics-value">${metadata.retrieval_analytics.chunks_retrieved}</span></div>
          <div class="analytics-row"><span class="analytics-label">Dense Matches</span><span class="analytics-value">${metadata.retrieval_analytics.dense_matches}</span></div>
          <div class="analytics-row"><span class="analytics-label">Sparse Matches</span><span class="analytics-value">${metadata.retrieval_analytics.sparse_matches}</span></div>
          <div class="analytics-row"><span class="analytics-label">Hybrid Score Avg</span><span class="analytics-value">${metadata.retrieval_analytics.hybrid_score_avg.toFixed(4)}</span></div>
        </div>`;
    }

    html += `
      <div class="checklist" id="checklist-${Date.now()}">
        <h5>Engineer Verification Checklist</h5>
        <div class="checklist-item" onclick="this.classList.toggle('completed')">
          <div class="checklist-checkbox"><span class="checklist-checkmark">✓</span></div>
          <span class="checklist-text">Acknowledge incident</span>
        </div>
        <div class="checklist-item" onclick="this.classList.toggle('completed')">
          <div class="checklist-checkbox"><span class="checklist-checkmark">✓</span></div>
          <span class="checklist-text">Verify root cause</span>
        </div>
        <div class="checklist-item" onclick="this.classList.toggle('completed')">
          <div class="checklist-checkbox"><span class="checklist-checkmark">✓</span></div>
          <span class="checklist-text">Apply remediation steps</span>
        </div>
        <div class="checklist-item" onclick="this.classList.toggle('completed')">
          <div class="checklist-checkbox"><span class="checklist-checkmark">✓</span></div>
          <span class="checklist-text">Confirm resolution</span>
        </div>
      </div>

      <div class="summary-section">
        <button class="summary-btn" onclick="toggleSummary(this)">📋 Generate Incident Summary</button>
        <div class="summary-content">
          <h5>Incident Summary</h5>
          <p><b>Incident:</b> ${escapeHtml(conversationHistory.length > 0 ? conversationHistory[conversationHistory.length - 2]?.content : 'N/A')}</p>
          <p><b>Symptoms:</b> ${escapeHtml(text.split('\n')[0] || 'N/A')}</p>
          <p><b>Root Cause:</b> Analyzed from retrieved runbooks</p>
          <p><b>Actions Taken:</b> Applied recommended steps</p>
          <p><b>Severity:</b> ${metadata.severity || 'N/A'}</p>
          <div class="summary-actions">
            <button class="download-btn" onclick="downloadSummary(this)">⬇️ Download as Markdown</button>
          </div>
        </div>
      </div>`;

    if(retrievalMs){
      html += `<div class="lat-footer">retrieved in ${retrievalMs}ms${generationMs ? ` · generated in ${generationMs}ms` : ''}</div>`;
    }
  }

  html += `</div>`;
  return html;
}

function toggleAnalytics(btn){
  const panel = btn.nextElementSibling;
  panel.classList.toggle('visible');
  btn.textContent = panel.classList.contains('visible') ? '▲ Retrieval Analytics' : '▼ Retrieval Analytics';
}

function toggleSummary(btn){
  const content = btn.nextElementSibling;
  content.classList.toggle('visible');
}

function downloadSummary(btn){
  const summaryDiv = btn.closest('.summary-content');
  let summaryText = '# Incident Summary\n\n';
  summaryText += `**Incident:** ${summaryDiv.querySelector('p:nth-of-type(1)').textContent.replace('Incident: ', '')}\n\n`;
  summaryText += `**Symptoms:** ${summaryDiv.querySelector('p:nth-of-type(2)').textContent.replace('Symptoms: ', '')}\n\n`;
  summaryText += `**Root Cause:** ${summaryDiv.querySelector('p:nth-of-type(3)').textContent.replace('Root Cause: ', '')}\n\n`;
  summaryText += `**Actions Taken:** ${summaryDiv.querySelector('p:nth-of-type(4)').textContent.replace('Actions Taken: ', '')}\n\n`;
  summaryText += `**Severity:** ${summaryDiv.querySelector('p:nth-of-type(5)').textContent.replace('Severity: ', '')}\n`;
  
  const blob = new Blob([summaryText], {type: 'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `incident-summary-${Date.now()}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

renderChips();
loadStats();
</script>
</body>
</html>
